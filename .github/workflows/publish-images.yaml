name: publish-images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Image tag
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KO_DEFAULTPLATFORMS: linux/amd64,linux/arm64
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images
        env:
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          make build-release-images \
            KO_DOCKER_REPO="${repo}" \
            KO_FLAGS="--image-label=org.opencontainers.image.source=${SOURCE}" \
            DOCKER_BUILD_FLAGS="--label=org.opencontainers.image.source=${SOURCE}"
